name: 信小兔爆料监控

# ============================================================================
# 为什么不是"每分钟一个 cron"？
#   GitHub Actions 的 schedule 最短只支持 5 分钟一次，且高峰期会延迟
#   15~30 分钟 —— cron 本身做不到 1 分钟粒度。
#
# 这里用的是「长跑接力」：
#   1) cron 每 2 小时只负责"点名"启动一个 job
#   2) job 起来后自己连续跑 5 小时，每 60 秒抓一轮（loop.sh）
#   3) concurrency 组让后续触发的 job 在队列里排队而不是并发
#      → 前一个刚结束、后一个立刻接上，宏观粒度稳定在 1 分钟
# ============================================================================

on:
  schedule:
    # 注意：cron 用 UTC。这里只是"点火时间"，真正的节奏由 loop.sh 控制。
    - cron: '0 */2 * * *'
  workflow_dispatch: # 支持在 Actions 页面手动点一下立刻启动

concurrency:
  group: xxt-monitor
  # 关键！false = 新 job 排队等待，而不是取消正在跑的
  # 这样才形成接力；设成 true 会每分钟掐断上一轮，反而断档
  cancel-in-progress: false

permissions:
  contents: write # 回写 state.json 需要写权限

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 330 # 上限 360 分钟，跑 300 分钟留足余量
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: 安装依赖
        run: pip install -r requirements.txt

      - name: 每分钟轮询（长跑接力 5 小时）
        env:
          PYTHONUNBUFFERED: '1'
          PYTHONIOENCODING: 'utf-8'
          NO_HEALTH_SERVER: '1' # Actions 里不需要健康检查端口
          POLL_INTERVAL: '60' # 1 分钟一轮
          # ↓↓↓ 推送配置请到仓库 Settings → Secrets and variables → Actions 里添加
          #     没配任何一项也能跑，只是新爆料只打进 Actions 日志
          MEMBER_ID: ${{ secrets.MEMBER_ID }}
          PUSH_CHANNEL: ${{ secrets.PUSH_CHANNEL }}
          WECOM_WEBHOOK: ${{ secrets.WECOM_WEBHOOK }}
          WXPUSHER_TOKEN: ${{ secrets.WXPUSHER_TOKEN }}
          WXPUSHER_UID: ${{ secrets.WXPUSHER_UID }}
          SERVERCHAN_KEY: ${{ secrets.SERVERCHAN_KEY }}
          BARK_URL: ${{ secrets.BARK_URL }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT: ${{ secrets.TELEGRAM_CHAT }}
          WEBHOOK_URL: ${{ secrets.WEBHOOK_URL }}
          # --- 邮件通道（PUSH_CHANNEL=email 时生效）---
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
        run: bash loop.sh 18000
