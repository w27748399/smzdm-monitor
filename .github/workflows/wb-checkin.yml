name: WorkBuddy Checkin

on:
  schedule:
    # UTC 01:20 / 13:20 = 北京时间 09:20 / 21:20，一天两次，幂等
    - cron: '20 1,13 * * *'
  workflow_dispatch:

concurrency:
  group: wb-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Do checkin
        id: checkin
        env:
          # 多账号：JSON 数组，脚本内部逐账号签到
          WB_CHECKIN_ACCOUNTS: ${{ secrets.WB_CHECKIN_ACCOUNTS }}
          # 回退（旧单账号配置，WB_CHECKIN_ACCOUNTS 缺失时生效）
          WB_CHECKIN_TOKEN: ${{ secrets.WB_CHECKIN_TOKEN }}
          WB_CHECKIN_UID: ${{ secrets.WB_CHECKIN_UID }}
          GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}
        run: python3 wb_checkin.py

      - name: Build credits report
        # 逐账号积分快照 + 7 天到期提醒；无论签到成功与否都抓（token 失效时抓不到也不影响结论）
        if: always()
        continue-on-error: true
        env:
          WB_CHECKIN_ACCOUNTS: ${{ secrets.WB_CHECKIN_ACCOUNTS }}
          WB_CHECKIN_TOKEN: ${{ secrets.WB_CHECKIN_TOKEN }}
          WB_CHECKIN_UID: ${{ secrets.WB_CHECKIN_UID }}
          GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}
        run: python3 wb_checkin.py --credits

      - name: Email daily result
        if: always()
        shell: python
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_EVENT: ${{ github.event_name }}
          GH_CRON_OK: ${{ job.status }}
        run: |
          import os, smtplib, ssl, datetime, json
          from email.mime.text import MIMEText
          from email.header import Header
          user = os.environ["EMAIL_USER"]; pwd = os.environ["EMAIL_PASS"]
          # 收件人固定为单一邮箱（按需求：只发 734352499@qq.com）
          to = "734352499@qq.com"
          host = (os.environ.get("SMTP_HOST") or "").strip() or "smtp.qq.com"
          port_s = (os.environ.get("SMTP_PORT") or "").strip()
          port = int(port_s) if port_s.isdigit() else 465
          use_ssl = (os.environ.get("SMTP_SSL") or "true").strip().lower() in ("1", "true", "yes")
          now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).strftime("%Y-%m-%d %H:%M")
          # 读签到结果（JSON，多账号；签到 step 未跑到时兜底）
          overall, otitle, accounts = "failed", "⚠️ 未执行到签到步骤", []
          try:
            with open("checkin_result.json", encoding="utf-8") as f:
              d = json.load(f)
              overall = d.get("overall") or "?"
              otitle = d.get("title") or "?"
              accounts = d.get("accounts") or []
          except FileNotFoundError:
            accounts = [{"name": "?", "status": "failed", "title": "⚠️ 未执行到签到步骤",
                         "detail": "workflow 在签到 step 之前就中断了（checkout/环境问题），请查看运行日志。"}]
          except Exception as e:
            accounts = [{"name": "?", "status": "failed", "title": "⚠️ 结果解析失败", "detail": str(e)}]
          # 读积分快照 + 快到期提醒块（--credits step 产出，已按账号分段）
          credits_block = ""
          try:
            with open("credits_block.txt", encoding="utf-8") as f:
              credits_block = f.read().strip()
          except FileNotFoundError:
            pass
          # 到期标记：主题行加警示（各账号合计）
          expire_mark = ""
          try:
            with open("credits_expire_flag.txt", encoding="utf-8") as f:
              flag, total = f.read().strip().split("|", 1)
              if flag == "1" and float(total) > 0:
                expire_mark = " ⚠️%s分将到期" % total
          except Exception:
            pass
          run_url = os.environ.get("GH_RUN_URL", "")
          body = "WorkBuddy 每日签到结果（%d 个账号）\n" % len(accounts) + "=" * 36 + "\n" \
                 "时间: " + now + " (北京时间)\n" \
                 "整体: " + otitle + "\n\n"
          for a in accounts:
            body += "· %s：%s\n" % (a.get("name", "?"), a.get("title", "?"))
            if a.get("status") in ("expired", "failed"):
              body += "    详情: %s\n" % str(a.get("detail", "")).replace("\n", " / ")
          if credits_block:
            body += "\n" + "-" * 36 + "\n" + credits_block + "\n"
          body += "\n触发: " + os.environ.get("GH_EVENT", "?") + "\n" \
                  "运行日志: " + run_url + "\n"
          msg = MIMEText(body, "plain", "utf-8")
          msg["Subject"] = Header("WorkBuddy 签到 " + otitle + expire_mark + " @ " + now, "utf-8")
          msg["From"] = user
          msg["To"] = to
          if use_ssl:
            s = smtplib.SMTP_SSL(host, port, context=ssl.create_default_context(), timeout=30)
          else:
            s = smtplib.SMTP(host, port, timeout=30); s.starttls(context=ssl.create_default_context())
          s.login(user, pwd)
          s.sendmail(user, [to], msg.as_string())
          s.quit()
          print("daily result email sent:", otitle, expire_mark, "->", to)
