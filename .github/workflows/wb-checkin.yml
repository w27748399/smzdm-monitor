name: WorkBuddy Checkin

on:
  schedule:
    # UTC 01:20 / 13:20 = 北京时间 09:20 / 21:20，一天两次，幂等
    - cron: '20 1,13 * * *'
  workflow_dispatch:

concurrency:
  group: wb-checkin
  cancel-in-progress: false

jobs:
  checkin:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Do checkin
        id: checkin
        env:
          WB_CHECKIN_TOKEN: ${{ secrets.WB_CHECKIN_TOKEN }}
          WB_CHECKIN_UID: ${{ secrets.WB_CHECKIN_UID }}
          GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}
        run: python3 wb_checkin.py

      - name: Email daily result
        if: always()
        shell: python
        env:
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_PASS: ${{ secrets.EMAIL_PASS }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_SSL: ${{ secrets.SMTP_SSL }}
          GH_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          GH_EVENT: ${{ github.event_name }}
          GH_CRON_OK: ${{ job.status }}
        run: |
          import os, smtplib, ssl, datetime
          from email.mime.text import MIMEText
          from email.header import Header
          user = os.environ["EMAIL_USER"]; pwd = os.environ["EMAIL_PASS"]; to = os.environ["EMAIL_TO"]
          host = os.environ.get("SMTP_HOST", "smtp.qq.com"); port = int(os.environ.get("SMTP_PORT", "465"))
          use_ssl = os.environ.get("SMTP_SSL", "true").lower() in ("1", "true", "yes")
          now = datetime.datetime.now(datetime.timezone(datetime.timedelta(hours=8))).strftime("%Y-%m-%d %H:%M")
          # 读签到结果文件（签到 step 未跑到时兜底）
          title, status, detail = "⚠️ 未执行到签到步骤", "skipped", "workflow 在签到 step 之前就中断了（checkout/环境问题），请查看运行日志。"
          try:
            with open("checkin_result.txt", encoding="utf-8") as f:
              for line in f:
                if line.startswith("status="): status = line.split("=",1)[1].strip()
                elif line.startswith("title="): title = line.split("=",1)[1].strip()
                elif line.startswith("detail="): detail = line.split("=",1)[1].strip()
          except FileNotFoundError:
            pass
          run_url = os.environ.get("GH_RUN_URL", "")
          body = "WorkBuddy 每日签到结果\n" + "=" * 32 + "\n" \
                 "时间: " + now + " (北京时间)\n" \
                 "结果: " + title + "\n" \
                 "详情: " + detail + "\n" \
                 "触发: " + os.environ.get("GH_EVENT", "?") + "\n" \
                 "运行日志: " + run_url + "\n"
          msg = MIMEText(body, "plain", "utf-8")
          msg["Subject"] = Header("WorkBuddy 签到 " + title + " @ " + now, "utf-8")
          msg["From"] = user
          msg["To"] = to
          if use_ssl:
            s = smtplib.SMTP_SSL(host, port, context=ssl.create_default_context(), timeout=30)
          else:
            s = smtplib.SMTP(host, port, timeout=30); s.starttls(context=ssl.create_default_context())
          s.login(user, pwd)
          s.sendmail(user, [to], msg.as_string())
          s.quit()
          print("daily result email sent:", title, "->", to)
